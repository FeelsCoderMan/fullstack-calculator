# Serves the built app and reverse-proxies the API, so the browser sees a single
# origin and the backend needs no CORS. "backend" is the compose service name.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. With proxy_pass set from a variable, nginx resolves
    # "backend" per request (cached 10s) instead of once at startup, so a
    # recreated backend container with a new IP keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # The API and its docs go to the backend, in one block so both always get the
    # same proxy settings. proxy_pass with a variable and no URI forwards the
    # original request URI. The same prefixes are proxied by Vite in development
    # (vite.config.ts). The slash-less "/swagger" and "/api" go to the backend too,
    # which redirects /swagger to /swagger/ (a regex location gets no automatic
    # trailing-slash redirect from nginx); "/swaggerx" or "/apix" stay with the app.
    location ~ ^/(?:api|swagger)(?:/|$) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset file name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Single page, no router: everything else is index.html, always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "DENY";
        try_files $uri $uri/ /index.html;
    }
}
