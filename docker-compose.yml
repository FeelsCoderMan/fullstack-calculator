name: fullstack-calculator

services:
  backend:
    build:
      context: ./backend
    image: fullstack-calculator-backend
    # Runtime config, required (the backend has no defaults).
    # Create it with: cp backend/.env.example backend/.env
    env_file:
      - path: ./backend/.env
        required: true
    ports:
      - "8080:8080"
    healthcheck:
      # $$ defers expansion to the container, which sees PORT from backend/.env.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Longer than SHUTDOWN_TIMEOUT so the graceful drain finishes before SIGKILL.
    stop_grace_period: 15s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: fullstack-calculator-frontend
    # nginx serves the app and proxies /api and /swagger to the backend service,
    # so the browser only ever talks to this one origin.
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    read_only: true
    # nginx writes its pid file and temp buffers under /tmp.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
